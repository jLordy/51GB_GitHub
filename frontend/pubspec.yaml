name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.4.0
  dio: ^5.9.2
  encrypt: ^5.0.3
  file_picker: ^11.0.2
  firebase_auth: ^6.5.0
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter:
    sdk: flutter
  flutter_pdfview: ^1.4.4
  flutter_riverpod: ^3.3.1
  flutter_webrtc: ^1.4.1
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  lottie: ^3.3.3
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.0
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  web: ^1.1.1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: TanSongbird
      fonts:
        - asset: assets/fonts/TANSONGBIRD.otf