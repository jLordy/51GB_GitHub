name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.4.0
  dio: ^5.9.2
  encrypt: ^5.0.3
  firebase_auth: ^6.5.0
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  lottie: ^3.3.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: TanSongbird
      fonts:
        - asset: assets/fonts/TANSONGBIRD.otf